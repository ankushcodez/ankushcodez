        <g><rect x="628" y="460" width="78" height="32" rx="16" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"><animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="0.45s" repeatCount="indefinite"/></rect><text x="667" y="481" text-anchor="middle" fill="#F8FAFC">Python</text></g>
        <g><rect x="716" y="460" width="94" height="32" rx="16" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.5"><animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="0.75s" repeatCount="indefinite"/></rect><text x="763" y="481" text-anchor="middle" fill="#F8FAFC">Supabase</text></g>
