    <rect x="478" y="40" width="672" height="34" rx="16" fill="#131C2E"/>
    <rect x="478" y="58" width="672" height="16" fill="#131C2E"/>
    <circle cx="500" cy="57" r="5" fill="#FF5F56"/><circle cx="520" cy="57" r="5" fill="#FFBD2E"/><circle cx="540" cy="57" r="5" fill="#27C93F"/>
    <text x="814" y="61" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="12" text-anchor="middle" fill="#94A3B8">ankush@adcodez ~ %</text>
