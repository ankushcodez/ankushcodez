          <text x="508" y="336"><tspan fill="#94A3B8">✉️ Email</tspan><tspan fill="#F8FAFC" x="640">ankush.codez@gmail.com</tspan></text></g>
        <g opacity="0"><animate attributeName="opacity" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
          <text x="508" y="366"><tspan fill="#94A3B8">🚀 Founder</tspan><tspan fill="#F8FAFC" x="640">ADCODEZ</tspan></text></g>
      </g>

      <line x1="508" y1="388" x2="1122" y2="388" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="508" y="408" font-size="12" font-weight="700" letter-spacing="2" fill="#94A3B8">SKILLS</text>

