        <g><rect x="716" y="418" width="94" height="32" rx="16" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.5"><animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect><text x="763" y="439" text-anchor="middle" fill="#F8FAFC">Voice AI</text></g>
        <g><rect x="820" y="418" width="94" height="32" rx="16" fill="#7C3AED" fill-opacity="0.12" stroke="#7C3AED" stroke-opacity="0.5"><animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="0.9s" repeatCount="indefinite"/></rect><text x="867" y="439" text-anchor="middle" fill="#F8FAFC">Next.js</text></g>
        <g><rect x="924" y="418" width="70" height="32" rx="16" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"><animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect><text x="959" y="439" text-anchor="middle" fill="#F8FAFC">React</text></g>
        <g><rect x="1004" y="418" width="86" height="32" rx="16" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.5"><animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect><text x="1047" y="439" text-anchor="middle" fill="#F8FAFC">Node.js</text></g>

