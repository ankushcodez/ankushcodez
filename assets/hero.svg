<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-label="Ankush Mehra — AI Automation Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080F"/><stop offset="0.5" stop-color="#0E0A20"/><stop offset="1" stop-color="#080D1C"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.18" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"><animate attributeName="stop-opacity" values="0.30;0.55;0.30" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.85" cy="0.75" r="0.75">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.38"><animate attributeName="stop-opacity" values="0.24;0.42;0.24" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.6" cy="0.1" r="0.6"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.18"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DDD6FE"><animate attributeName="offset" values="-0.3;0.3;-0.3" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="0.45" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#38BDF8"><animate attributeName="offset" values="0.7;1.3;0.7" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="0.5" stop-color="#4F46E5"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#ffffff" stroke-opacity="0.03"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="400" rx="24" fill="url(#g1)"/><rect width="1200" height="400" rx="24" fill="url(#g2)"/><rect width="1200" height="400" rx="24" fill="url(#g3)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- orbiting node system -->
  <g stroke="url(#line)" fill="none" opacity="0.55">
    <circle cx="990" cy="200" r="70" stroke-width="1.6"/>
    <circle cx="990" cy="200" r="112" stroke-width="1.3" opacity="0.6"/>
    <circle cx="990" cy="200" r="154" stroke-width="1" opacity="0.35"/>
  </g>
  <circle cx="990" cy="200" r="7" fill="#38BDF8">
    <animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- inner ring: 4 nodes orbiting together -->
  <g>
    <circle cx="990" cy="130" r="5" fill="#7C3AED"/>
    <circle cx="1060" cy="200" r="5" fill="#4F46E5"/>
    <circle cx="990" cy="270" r="5" fill="#06B6D4"/>
    <circle cx="920" cy="200" r="5" fill="#818CF8"/>
    <animateTransform attributeName="transform" type="rotate" from="0 990 200" to="360 990 200" dur="14s" repeatCount="indefinite"/>
  </g>
  <!-- outer ring: 2 nodes orbiting opposite direction -->
  <g>
    <circle cx="990" cy="88"  r="4" fill="#A78BFA"/>
    <circle cx="990" cy="312" r="4" fill="#22D3EE"/>
    <animateTransform attributeName="transform" type="rotate" from="360 990 200" to="0 990 200" dur="20s" repeatCount="indefinite"/>
  </g>

  <!-- floating ambient particles -->
  <circle cx="150" cy="80" r="2.4" fill="#8B5CF6" opacity="0.6"><animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="340" r="2" fill="#38BDF8" opacity="0.5"><animate attributeName="cy" values="340;320;340" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="220" r="1.8" fill="#06B6D4" opacity="0.5"><animate attributeName="cy" values="220;200;220" dur="4.5s" repeatCount="indefinite"/></circle>

  <text x="72" y="150" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#name)">Ankush Mehra</text>
  <rect x="74" y="172" width="180" height="5" rx="2.5" fill="url(#line)">
    <animate attributeName="width" values="0;180;180" dur="1.6s" fill="freeze"/>
  </rect>
  <text x="74" y="216" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#C7CFE2">AI Automation Engineer &amp; SaaS Builder</text>
  <text x="74" y="250" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#8B93A7">Founder, ADCODEZ · n8n Specialist · Voice AI Developer</text>

  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">
    <g><rect x="74"  y="286" width="132" height="36" rx="18" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/></rect><text x="140" y="309" fill="#C4B5FD" text-anchor="middle">AI Automation</text></g>
    <g><rect x="218" y="286" width="132" height="36" rx="18" fill="#4F46E5" fill-opacity="0.16" stroke="#4F46E5" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect><text x="284" y="309" fill="#A5B4FC" text-anchor="middle">Voice Agents</text></g>
    <g><rect x="362" y="286" width="132" height="36" rx="18" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect><text x="428" y="309" fill="#93C5FD" text-anchor="middle">Full-Stack</text></g>
    <g><rect x="506" y="286" width="132" height="36" rx="18" fill="#06B6D4" fill-opacity="0.16" stroke="#06B6D4" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect><text x="572" y="309" fill="#67E8F9" text-anchor="middle">SaaS</text></g>
  </g>
</svg>
